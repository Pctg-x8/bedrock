[workspace]
members = ["brvk", "vk_entrypoint_builder", "vk_sys_generator"]
exclude = ["wayland_examples", "bedrock-examples"]

[package]
name = "bedrock"
version = "0.1.0-vk1.4.305"
authors = ["S.Percentage <Syn.Tri.Naga@gmail.com>"]
description = "Glue library between Vulkan and Rust"
license = "MIT"
edition = "2024"

[features]
default = ["alloc"]

VK_KHR_surface = ["bedrock-vk/VK_KHR_surface"]
VK_KHR_swapchain = ["bedrock-vk/VK_KHR_swapchain", "VK_KHR_surface"]
