Multithreaded = []
Presentation = ["VK_KHR_surface", "VK_KHR_swapchain", "VK_KHR_display"]
DynamicLoaded = ["Implements", "bedrock-vk/DynamicLoaded"]
CustomResolver = ["bedrock-vk/CustomResolver"]
alloc = []

[workspace.dependencies]
x11 = { version = "^2.15" }
xcb = { version = "^1.6" }
android = { git = "https://github.com/Pctg-x8/android-defs-rs" }
libloading = { version = "0.5" }
widestring = { version = "1.1" }
windows = { version = "0.62" }
parking_lot = "0.12.1"
tracing = "0.1"

[dependencies]
x11 = { workspace = true, optional = true }
xcb = { workspace = true, optional = true }
android = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
widestring = { workspace = true, optional = true }

tracing.workspace = true
derives = { path = "./derives" }
parking_lot.workspace = true
cfg-if = "1.0.0"
bedrock-vk.path = "./brvk"

[dependencies.windows]
workspace = true
optional = true
features = ["Win32_Foundation", "Win32_Graphics_Gdi"]

[dev-dependencies]
rusty-hook = "0.11.2"

[lints.clippy]
new_without_default = "allow"
